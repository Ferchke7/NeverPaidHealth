name: CD - Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Secrets Configuration
        id: check_secrets
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ] || [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ Production server secrets (SERVER_HOST, SSH_PRIVATE_KEY) are not configured."
            echo "Skipping direct SSH deployment. Configure repository secrets in GitHub Settings > Secrets to enable automated CD."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH & Docker Compose
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'ferdavs' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting automated deployment on VPS..."
            cd ~/neverpaidhealth || cd ~/NeverPaidHealth || cd /home/ferdavs/neverpaidhealth
            
            # Reset any untracked or local changes and pull latest main
            git fetch origin main
            git reset --hard origin/main
            
            # Reset and create clean production environment files
            rm -f deploy/.env .env
            cat << 'EOF' > .env
AUTH_DEV_MODE=true
EOF
            if [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ]; then
              echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
              echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
            fi
            if [ -n "${{ secrets.GOOGLE_CLIENT_SECRET }}" ]; then
              echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
            fi
            if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
              echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
            fi
            if [ -n "${{ secrets.GEMINI_MODEL }}" ]; then
              echo "GEMINI_MODEL=${{ secrets.GEMINI_MODEL }}" >> .env
            else
              echo "GEMINI_MODEL=gemini-2.0-flash" >> .env
            fi

            mkdir -p deploy
            cp .env deploy/.env
            
            # Build and launch containers with explicit env-file and force-recreate
            echo "📦 Building and restarting containers..."
            docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml build
            docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml up -d --force-recreate --remove-orphans
            
            # Ensure static files permissions
            docker exec neverpaid-frontend chmod -R 755 /usr/share/nginx/html 2>/dev/null || true
            
            # Smoke test
            echo "🧪 Running health check..."
            sleep 3
            curl -f -I http://localhost:3002/ || exit 1
            
            # Clean up old images
            docker image prune -f
            echo "✅ Deployment completed successfully!"
