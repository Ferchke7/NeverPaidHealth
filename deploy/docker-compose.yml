version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: neverpaid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neverpaid
      POSTGRES_PASSWORD: neverpaid_dev_password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neverpaid -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:latest
    container_name: neverpaid-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/varz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
