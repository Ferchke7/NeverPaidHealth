<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="127" stroke="#27272a" stroke-width="2" fill="none"/>

  <!-- Subtle glow in center -->
  <circle cx="256" cy="256" r="160" fill="#f97316" opacity="0.08" filter="url(#glow)"/>

  <!-- Dumbbell Icon -->
  <g transform="translate(0, 0)">
    <!-- Main Center Bar -->
    <rect x="120" y="240" width="272" height="32" rx="16" fill="url(#orangeGrad)"/>
    <rect x="220" y="236" width="72" height="40" rx="8" fill="#fdba74" opacity="0.9"/>
    
    <!-- Left Outer Weight Plate -->
    <rect x="100" y="156" width="32" height="200" rx="14" fill="url(#orangeGrad)" filter="url(#glow)"/>
    <!-- Left Inner Weight Plate -->
    <rect x="144" y="186" width="24" height="140" rx="10" fill="url(#orangeGrad)"/>
    <!-- Left Cap -->
    <rect x="80" y="244" width="20" height="24" rx="6" fill="#ea580c"/>

    <!-- Right Outer Weight Plate -->
    <rect x="380" y="156" width="32" height="200" rx="14" fill="url(#orangeGrad)" filter="url(#glow)"/>
    <!-- Right Inner Weight Plate -->
    <rect x="344" y="186" width="24" height="140" rx="10" fill="url(#orangeGrad)"/>
    <!-- Right Cap -->
    <rect x="412" y="244" width="20" height="24" rx="6" fill="#ea580c"/>
  </g>

  <!-- Nutrition & AI Pulse Bolt / Heartbeat in Foreground -->
  <path d="M256 120 L276 228 L320 228 L244 392 L258 276 L216 276 Z" 
        fill="url(#emeraldGrad)" 
        stroke="#09090b" 
        stroke-width="6" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
</svg>
